<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The tab icon. The Next apps get one from `app/icon.png` by convention and this file is the
         equivalent for a Vite or Angular app, which have no such convention and had no icon at all
         (`PD-131`). Same 512px file as the Next apps, so every port shows the same mark. -->
    <link rel="icon" type="image/png" href="/icon.png" sizes="512x512" />
    <title>VuiAdmin free, Vue · VUI</title>
    <meta
      name="description"
      content="The free VuiAdmin dashboard in its Vue edition: nineteen pages on the same design system as the paid editions, MIT licensed."
    />
    <!-- A demo, and not something a search engine should offer instead of the product page. -->
    <meta name="robots" content="noindex" />
  </head>
  <body class="h-full">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
